<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/join.css">
    <title>JOIN</title>
</head>
<body>
<div class="main-container">
    <h1><span>MEMBER JOIN</span></h1>
    <div class="table-style">
        <form action="/member/join" method="post">
            <table>
                <tr>
                    <th>아이디</th>
                    <td><input type="text" name="mid" class="input-style" placeholder="아이디를 입력하세요." required></td>
                </tr>
                <tr>
                    <th>비밀번호</th>
                    <td><input type="password" name="mpw" class="input-style" placeholder="비밀번호를 입력하세요." required></td>
                </tr>
                <tr>
                    <th>이름</th>
                    <td><input type="text" name="mname" class="input-style" placeholder="이름을 입력하세요." required></td>
                </tr>
            </table>
            <div class="button-wrapper">
                <button type="submit" class="btn-style">가입하기</button>
                <button type="button" class="btn-style" onclick="location.href='/main'">메인으로</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
